version: 2

project_name: wanwanlog

before:
  hooks:
    - go mod tidy

builds:
  - id: wwlog
    main: ./cmd/wwlog
    binary: wwlog
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: wwlog
    ids:
      - wwlog
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
  make_latest: false

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
